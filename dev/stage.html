<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>HATGEN · Stage-Harness</title>
    <link rel="icon" href="../favicon.svg" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0a0202;
        overflow: hidden;
      }
      #webgl {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #hud {
        position: fixed;
        left: 12px;
        bottom: 12px;
        font: 11px/1.45 'JetBrains Mono Variable', ui-monospace, monospace;
        letter-spacing: 0.04em;
        color: rgba(255, 225, 222, 0.8);
        background: rgba(10, 2, 2, 0.6);
        border: 1px solid rgba(255, 200, 200, 0.1);
        padding: 8px 10px;
        border-radius: 8px;
        white-space: pre;
        pointer-events: none;
      }
      #marker {
        position: fixed;
        width: 14px;
        height: 14px;
        margin: -7px 0 0 -7px;
        border: 1.5px solid #ff3333;
        border-radius: 50%;
        pointer-events: none;
        left: 0;
        top: 0;
      }
    </style>
  </head>
  <body>
    <canvas id="webgl" aria-hidden="true"></canvas>
    <div id="hud" hidden></div>
    <div id="marker" hidden></div>
    <script type="module" src="./stage.js"></script>
  </body>
</html>
